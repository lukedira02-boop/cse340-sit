services:
  - type: web
    name: cse340-service-network
    runtime: node
    buildCommand: npm install && npm run db:setup
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cse340-service-db
          property: connectionString

databases:
  - name: cse340-service-db
    plan: free
